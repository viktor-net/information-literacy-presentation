<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Информационная компетентность и информационная культура личности преподавателя — презентация" />
    <meta name="color-scheme" content="dark light" />
    <title>Информационная компетентность и информационная культура личности преподавателя</title>
    <script>
      // Ставим тему до отрисовки, чтобы не было вспышки светлого/тёмного.
      // По умолчанию — как в системе; если определить нечем, светлая.
      // Здесь же ставим иконку вкладки: браузеры кешируют favicon
      // агрессивно, и сменить его позже, уже нарисованный неправильный, нельзя.
      (function () {
        var t = 'light'
        try {
          var p = localStorage.getItem('deck-theme') || 'system'
          t =
            p === 'dark' || p === 'light'
              ? p
              : typeof window.matchMedia === 'function' &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (e) {
          t = 'light'
        }
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t

        var svg =
          t === 'dark'
            ? "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#0e1220'/><path d='M12 8.5 23 15 12 21.5Z' fill='#7ba3ff'/><rect x='8' y='24' width='16' height='2.5' rx='1.25' fill='#2ed0ce'/></svg>"
            : "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='#fff' stroke='#d8deee'/><path d='M12 8.5 23 15 12 21.5Z' fill='#3b5fd0'/><rect x='8' y='24' width='16' height='2.5' rx='1.25' fill='#0e8f88'/></svg>"
        var icon = document.createElement('link')
        icon.rel = 'icon'
        icon.href = 'data:image/svg+xml,' + encodeURIComponent(svg)
        document.head.appendChild(icon)
      })()
    </script>

среды на развитие личности и общества **существенно возрастает**","Происходят **необратимые изменения** устоявшихся социальных отношений, образа и стиля жизни, мышления, мироощущения"],notes:"Ключевая мысль: информация стала реальным социальным ресурсом. Стоит подчеркнуть, что сами по себе информационные объёмы не делают человека компетентным — важна способность им пользоваться."},{id:"revolutions",layout:"timeline",kicker:"Раздел 1 · История",title:"Пять информационных революций",items:[{title:"Речь",text:"Возникновение языковой речи"},{title:"Письменность",text:"Появление знаковой фиксации"},{title:"Книгопечатание",text:"Изобретение печатного станка"},{title:"Электросвязь",text:"Радио, телеграф, телефон, телевидение"},{title:"Цифровая",text:"Персональные компьютеры и Интернет как глобальная информационная сеть",active:!0}],notes:"Пятая революция происходит прямо сейчас. Общий вектор: от управления словом к мгновенной глобальной цифровой среде. Именно она определяет требования к современному педагогу."},{id:"changes",layout:"bullets",kicker:"Раздел 1 · Новые условия",title:"Изменения в производстве и потреблении информации",lead:"Суть принципиальных изменений сводится к следующему:",items:["Информация и знания стали **главной преобразующей силой общества**","Новизна, быстротечность, ускорение — наиболее характерные черты современной жизни","Цикл обновления производственных и социальных технологий — **6–8 лет**, опережая темпы смены поколений","Непрерывное образование и способность к переквалификации — **неотъемлемая часть** сохранения социального статуса личности","Судьба каждого человека зависит от способности своевременно находить, получать, адекватно воспринимать и продуктивно использовать новую информацию"],notes:"Обратите внимание на цифры: 2–3 года устаревания знаний против 6–8 лет цикла обновления технологий. Отсюда следует практический вывод — нельзя «выучить и забыть», нужно уметь переучиваться."},{id:"learning-society",layout:"cards",kicker:"Раздел 1 · Общество",title:"«Обучающееся общество»",columns:3,items:[{label:"01",title:"Новая техника",text:"Создаются более современные средства производства, хранения и распространения информации."},{label:"02",title:"Новая информационная среда",text:"Оптимизируется функционирование производства, государственных органов, управленческих структур, учреждений образования, науки и культуры."},{label:"03",title:"Новые ИТ",text:"Информационные технологии всё шире входят в повседневную жизнь, информационные системы становятся неотъемлемой её частью."}],notes:"Информационное общество называют обучающимся, поскольку непрерывное образование становится нормой, а не исключением."},{id:"competence-approach",layout:"compare",kicker:"Раздел 1 · Парадигма",title:"Компетентностный подход: от знаний к компетенциям",left:{badge:"Было",title:"Знаниевая парадигма",items:["Результат обучения — приобретение **знаний, умений и навыков**","Бесконечное накопление информации **теряет смысл**","Знания устаревают каждые **2–3 года**"]},right:{badge:"Стало",title:"Компетентностная парадигма",items:["Результат — **профессионально значимые качества личности**, ключевые компетенции","Не готовые знания, а **способы и технологии их получения**","Формирование потребности учиться, повышение интеллекта, мотивация к самореализации"]},stats:[{value:"2–3 года",label:"устаревание знаний"},{value:"6–8 лет",label:"цикл обновления технологий"},{value:"1 набор",label:"ключевых компетенций от государственного заказа"}],notes:"Ключевая мысль: компетентностная парадигма осознаёт бессмысленность бесконечного накопления знаний и предлагает набор компетенций, установленных государственным заказом."},{id:"section-2",layout:"section",kicker:"Раздел 2",title:"Информационная культура",number:"02",hint:"Трактовки учёных · аспекты проявления · культура как фундамент компетентности",notes:"Второй раздел — информационная культура."},{id:"culture-definitions",layout:"cards",kicker:"Раздел 2 · Понятие",title:"Информационная культура: четыре трактовки",columns:2,items:[{label:"О. В. Киева",title:"Уровень развития",text:"Исторически определённый уровень развития общества и человека, связанный с качественно новым уровнем производства, переработки и распространения информации."},{label:"Э. П. Семенюк",title:"Степень умения",text:"Степень совершенства умения человека работать с информацией: получать, накапливать, кодировать, обрабатывать, передавать."},{label:"Е. А. Медведева",title:"Уровень знаний",text:"Уровень знаний для свободной ориентации в информационном пространстве. Информационная культура — особый стиль мышления."},{label:"Н. И. Гендина",title:"Мировоззрение и деятельность",text:"Совокупность информационного мировоззрения и системы знаний и умений для целенаправленной самостоятельной деятельности."}],notes:"Трактовки не противоречат друг другу, а выделяют разные стороны: уровень развития, умение, знание, деятельность. Компьютерная, информационная грамотность и компьютерная образованность — предпосылки информационной культуры, её необходимые составляющие."},{id:"culture-aspects",layout:"split",kicker:"Раздел 2 · Проявление",title:"Информационная культура: суть и аспекты",quote:{text:"Совокупность информационного мировоззрения и системы знаний и умений, обеспечивающих целенаправленную самостоятельную деятельность по оптимальному удовлетворению индивидуальных информационных потребностей с использованием как традиционных, так и новых информационных технологий",author:"Н. И. Гендина"},items:["Навыки использования технических устройств — **от телефона до персонального компьютера и сетей**","Способность применять компьютерную информационную технологию и программные продукты","Умение **извлекать информацию** из различных источников и представлять её в понятном виде","Владение основами **аналитической переработки** информации","Умение работать с различной информацией","Знание особенностей **информационных потоков** в своей области деятельности"],notes:"Формирование общей информационной культуры в перву
